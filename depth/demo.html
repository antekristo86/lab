<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>depth scroll</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: crosshair; }
  html.light, html.light body { background: #000050; }
  html.light .plate { background-color: #000050; }
  body { font-family: ui-monospace, monospace; }
  #space {
    position: fixed; inset: 0;
    perspective: 1100px;
    transform-style: preserve-3d;
  }
  .plate {
    position: absolute; left: 50%; top: 50%;
    width: min(46vw, 340px);
    aspect-ratio: 16 / 10;
    background: #000 center / cover no-repeat;
    will-change: transform, opacity;
  }
</style>
</head>
<body>
<div id="space"></div>
<script>
// depth scroll. cards on the z axis, ios physics: direct follow while
// scrolling, momentum with friction on release, the deceleration steered
// onto the predicted card. velocity is continuous through the whole arc.
// hitting an edge with speed bumps like a scroll view.
const COUNT = 8;
const GAP = 900;
const MAXZ = (COUNT - 1) * GAP;

const space = document.getElementById('space');
const plates = [];
for (let i = 0; i < COUNT; i++) {
  const el = document.createElement('div');
  el.className = 'plate';
  el.style.backgroundImage = `url(img/0${i + 1}.jpg)`;
  space.appendChild(el);
  plates.push(el);
}

let camZ = 0, targetZ = 0, velZ = 0, lastInput = 0;
let inertiaSlot = null;
let bounce = false, bounceBound = 0;

const P = {
  gain: 4,            // wheel input gain
  camLerp: 0.4,       // follow speed while actively scrolling
  friction: 0.99,     // momentum decay per frame at speed
  tailFriction: 0.88, // decay when nearly there. kills the crawl
  steer: 0.3,         // how firmly the glide is steered onto the card
  tilt: 0.13,         // velocity tilt amount
  bumpK: 0.14,        // edge wall stiffness. depth of the bump comes from impact speed
  bumpD: 0.16         // bump damping. one visible bounce, then done
};

function addInput(dy) {
  if (bounce) {
    // momentum tail into the wall is swallowed. pulling away cancels
    const towardWall = (bounceBound === 0 && dy < 0) || (bounceBound === MAXZ && dy > 0);
    if (towardWall) return;
    bounce = false;
  }
  // standing at the wall and flicking into it: the impact comes straight
  // from the input speed. depth scales with how hard you hit
  const atTop = camZ <= 2 && dy < 0;
  const atBottom = camZ >= MAXZ - 2 && dy > 0;
  if ((atTop || atBottom) && Math.abs(dy) > 18) {
    bounce = true;
    bounceBound = atTop ? 0 : MAXZ;
    velZ = (atTop ? -1 : 1) * Math.min(Math.abs(dy) * 0.9, 55);
    lastInput = 0;
    return;
  }
  // full speed sensitivity. the predicted landing handles the rest
  targetZ += dy * P.gain;
  targetZ = Math.max(0, Math.min(MAXZ, targetZ));
  lastInput = performance.now();
}

addEventListener('wheel', e => { e.preventDefault(); addInput(e.deltaY); }, { passive: false });

// touch: while the finger is down the stack follows directly. the flick
// velocity is measured and handed to a synthetic trackpad tail on
// release, otherwise the momentum dies with the finger and feels heavy
let touchY = null, touchV = 0, touchT = 0;
addEventListener('touchstart', e => {
  touchY = e.touches[0].clientY;
  touchV = 0;
  touchT = performance.now();
}, { passive: true });
addEventListener('touchmove', e => {
  if (touchY === null) return;
  const dyPix = touchY - e.touches[0].clientY;
  addInput(dyPix * 3.0);
  const now = performance.now(), dt = now - touchT;
  if (dt > 0) {
    const v = dyPix / (dt / 16.7);
    touchV = touchV * 0.6 + v * 0.4;
  }
  touchT = now;
  touchY = e.touches[0].clientY;
}, { passive: true });
addEventListener('touchend', () => {
  touchY = null;
  if (bounce) { touchV = 0; return; }
  if (Math.abs(touchV) > 0.3) {
    let v = Math.max(-40, Math.min(40, touchV));
    const momentum = () => {
      if (touchY !== null || bounce) return;
      addInput(v * 3.0);
      v *= 0.95;
      if (Math.abs(v) > 0.15) requestAnimationFrame(momentum);
    };
    requestAnimationFrame(momentum);
  }
  touchV = 0;
});

// programmatic jump: hand the landing slot straight to the deceleration,
// bypassing the flick prediction
function jumpTo(z) {
  inertiaSlot = Math.max(0, Math.min(MAXZ, z));
  targetZ = camZ;
  lastInput = 0;
}

addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') jumpTo(Math.round(camZ / GAP) * GAP + GAP);
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') jumpTo(Math.round(camZ / GAP) * GAP - GAP);
});


// ---- theme: the host's light/dark reaches into the drop ----
const ANTE_THEMES = { dark: { bg: '#000000', fg: '#ffffff' }, light: { bg: '#000050', fg: '#FFFF00' } };
let anteTheme = 'dark';
try { if (localStorage.getItem('anteTheme') === 'light') anteTheme = 'light'; } catch (e) {}

// the light theme rebuilds each plate from the theme's own two colors:
// shadows sink into the blue, light rises into the yellow. baked once
const duoCache = {};
function duoUrl(src, cb) {
  if (duoCache[src]) return cb(duoCache[src]);
  const img = new Image();
  img.src = src;
  img.onload = () => {
    const w = Math.min(1000, img.naturalWidth);
    const h = Math.round(img.naturalHeight * w / img.naturalWidth);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0, w, h);
    const d = x.getImageData(0, 0, w, h);
    const px = d.data;
    for (let i = 0; i < px.length; i += 4) {
      const l = (px[i] * 0.2126 + px[i + 1] * 0.7152 + px[i + 2] * 0.0722) / 255;
      px[i] = 255 * l;
      px[i + 1] = 255 * l;
      px[i + 2] = 80 * (1 - l);
    }
    x.putImageData(d, 0, 0);
    duoCache[src] = c.toDataURL('image/jpeg', 0.85);
    cb(duoCache[src]);
  };
}
function applyAnteTheme() {
  document.documentElement.classList.toggle('light', anteTheme === 'light');
  plates.forEach((el, i) => {
    const src = 'img/0' + (i + 1) + '.jpg';
    if (anteTheme === 'light') {
      duoUrl(src, u => { if (anteTheme === 'light') el.style.backgroundImage = 'url(' + u + ')'; });
    } else {
      el.style.backgroundImage = 'url(' + src + ')';
    }
  });
}
addEventListener('message', e => { if (e.data && e.data.anteTheme) { anteTheme = e.data.anteTheme; applyAnteTheme(); } });
applyAnteTheme();

function frame() {
  // ios physics: while scrolling, direct follow. on release, momentum
  // with friction, then a critically damped spring lands on the card.
  // velocity is continuous through the whole arc
  const idle = performance.now() - lastInput;
  const prev = camZ;

  if (bounce) {
    // apple bump: the wall was hit with speed. penetration depth comes
    // from the impact, the return starts immediately
    velZ += (bounceBound - camZ) * P.bumpK - velZ * P.bumpD;
    camZ += velZ;
    targetZ = camZ;
    if (Math.abs(camZ - bounceBound) < 0.4 && Math.abs(velZ) < 0.4) {
      camZ = bounceBound; velZ = 0; targetZ = bounceBound;
      bounce = false;
    }
  } else if (idle < 80) {
    camZ += (targetZ - camZ) * P.camLerp;
    velZ = camZ - prev;
    inertiaSlot = null;
    // impact: arriving at the wall with speed starts the bump
    if (targetZ <= 0 && camZ < 50 && velZ < -2.5) { bounce = true; bounceBound = 0; }
    if (targetZ >= MAXZ && camZ > MAXZ - 50 && velZ > 2.5) { bounce = true; bounceBound = MAXZ; }
  } else {
    // predict where the glide would end, pick that card, and steer the
    // whole deceleration onto it. one continuous curve, no handoff, no pause
    if (inertiaSlot === null) {
      const pred = camZ + velZ * P.friction / (1 - P.friction);
      inertiaSlot = Math.max(0, Math.min(MAXZ, Math.round(pred / GAP) * GAP));
    }
    // friction eases toward the tail value as speed dies, so the last
    // millimeters finish decisively instead of crawling
    const fe = P.tailFriction + (P.friction - P.tailFriction) * Math.min(Math.abs(velZ) / 8, 1);
    const needed = (inertiaSlot - camZ) * (1 - fe) / fe;
    velZ += (needed - velZ) * P.steer;
    velZ *= fe;
    camZ += velZ;
    if (Math.abs(velZ) < 0.02 && Math.abs(inertiaSlot - camZ) < 0.5) { camZ = inertiaSlot; velZ = 0; }
    if (camZ < 40 && velZ < -2.5) { bounce = true; bounceBound = 0; }
    if (camZ > MAXZ - 40 && velZ > 2.5) { bounce = true; bounceBound = MAXZ; }
    if (camZ < 0)    { camZ = 0; velZ = Math.max(0, velZ); }
    if (camZ > MAXZ) { camZ = MAXZ; velZ = Math.min(0, velZ); }
    targetZ = camZ;
  }

  const tilt = Math.max(-4, Math.min(4, velZ * P.tilt));
  plates.forEach((el, i) => {
    const tz = camZ - i * GAP;
    let op;
    if (tz > 0) op = Math.max(0, 1 - tz / (GAP * 0.45));
    else op = Math.max(0, 1 - (-tz) / (GAP * 2.6));
    // at rest: no 3d layer, so the type stays crisp
    const settled = Math.abs(tz) < 0.5 && Math.abs(velZ) < 0.05;
    el.style.transform = settled
      ? 'translate(-50%, -50%)'
      : `translate(-50%, -50%) translateZ(${tz}px) rotateX(${tilt}deg)`;
    el.style.opacity = op.toFixed(3);
    el.style.visibility = op <= 0 ? 'hidden' : 'visible';
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
