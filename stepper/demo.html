<script>
// jelly stepper. the same liquid as the jelly glass drop, counting.
// the value lives behind the glass on a wheel; the minus and the plus
// are droplets that are born out of the body and swallowed back into
// it at the ends of the range. nothing fades, nothing is keyframed:
// the tearing and the healing fall out of the same smooth union.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false });

// ---- the plate behind the glass. the digits are drawn here, not on
// top, so the lens has something to refract and the number is only
// ever seen through the body ----
const tex2d = document.createElement('canvas');
const ctx = tex2d.getContext('2d');
const plateImg = new Image();
plateImg.src = './plate.jpg';

let dpr = 1;

const ANTE_THEMES = { dark: { bg: '#000000', fg: '#ffffff' }, light: { bg: '#000050', fg: '#FFFF00' } };
let anteTheme = 'dark';
try { if (localStorage.getItem('anteTheme') === 'light') anteTheme = 'light'; } catch (e) {}


const JELLY = [
"M50.96 142.296C40.1147 142.296 30.9027 140.009 23.324 135.436C15.876 130.863 10.1267 124.656 6.076 116.816C2.156 108.845 0.130666 99.764 0 89.572L29.988 88.2C30.1187 98.1307 32.0133 105.448 35.672 110.152C39.3307 114.856 44.4267 117.208 50.96 117.208C57.624 117.208 62.7853 114.921 66.444 110.348C70.1027 105.775 71.932 98.7187 71.932 89.18V0H101.724V89.18C101.724 100.025 99.568 109.433 95.256 117.404C91.0747 125.375 85.1947 131.516 77.616 135.828C70.0373 140.14 61.152 142.296 50.96 142.296Z",
"M122.654 139.16V0H219.478V25.088H152.446V57.036H217.126V81.732H152.446V114.072H221.046V139.16H122.654Z",
"M239.58 139.16V0H269.372V131.124L252.908 114.072H333.464V139.16H239.58Z",
"M350.212 139.16V0H380.005V131.124L363.54 114.072H444.096V139.16H350.212Z",
"M466.776 139.16V85.064L418.364 0H451.292L481.672 56.056L511.856 0H544.784L496.568 85.064V139.16H466.776Z"
];

const MAXV = 5;                 // 0 through 5. six steps, nothing more
let value = 0;
let wheel = 0, wheelV = 0;      // the wheel's position, in values, springed

const vsSrc = `
attribute vec2 p;
varying vec2 vUv;
void main() { vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;

const fsSrc = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime;
uniform vec2  uPan;      // background drift
uniform float uScale;    // grows on hover
// glass, figma's model: every dial does exactly one thing
uniform float uLightAngle, uLightPower;   // where the light stands, how hard
uniform float uRefraction;                // how far the ray is pushed
uniform float uDepth;                     // body thickness, drives magnification
uniform float uDispersion;                // spectral split
uniform float uFrost;                     // milkiness
uniform float uSplay;                     // how sharply the rim flares
// this piece specifically
uniform float uShapeW, uShapeH, uSmoke, uSmokePos;
uniform float uShadow;
uniform float uShadowUp; // 1 = the cast may not reach above the body
// the aurora: how bright, how fast it drifts, how tall the rays stand
uniform float uAurora, uAuroraSpeed, uAuroraRay;
uniform float uHover;    // springed 0..1, the aurora breathes in on hover
uniform float uDropHov[3];// each circle's own hover level
uniform float uBounce;   // how much light the bodies throw on each other
uniform float uPool;     // the caustic pool on the ground below
uniform float uHalo;     // how far the aurora shines past the rim
uniform vec2 uLens;      // lens center, uv
uniform float uR;        // lens radius, uv (y-normalized)
uniform vec2 uDeform;    // squash and stretch, from the physics
uniform vec2 uDrops[3];  // droplet centres, uv
uniform float uDropRs[3];// their radii, y-normalized. 0 = absent
uniform float uNeck;     // how gooey the join is right now

// a rectangle with rounded corners. exact sdf
float lensField(vec2 q, vec2 c, float r) {
  vec2 halfSize = vec2(r * uShapeW * (1.0 + uDeform.x),
                       r * uShapeH * (1.0 + uDeform.y)) * uScale;
  float rad = halfSize.y;   // always half the height: clean semicircular ends
  vec2 d2 = abs(q - c) - (halfSize - rad);
  return length(max(d2, vec2(0.0))) + min(max(d2.x, d2.y), 0.0) - rad;
}

// the button and the droplet are one liquid. a smooth union joins
// their fields: while they are close the join builds a meniscus, as
// they separate it stretches into a neck, thins, and tears. none of
// that is animated, it falls out of the smin
float scene(vec2 q, vec2 c, float r) {
  float a = lensField(q, c, r);
  float aspect = uRes.x / uRes.y;
  for (int i = 0; i < 3; i++) {
    if (uDropRs[i] < 1e-4) continue;
    vec2 dc = vec2(uDrops[i].x * aspect, uDrops[i].y);
    float b = length(q - dc) - uDropRs[i];
    float h = clamp(0.5 + 0.5 * (b - a) / uNeck, 0.0, 1.0);
    a = mix(b, a, h) - uNeck * h * (1.0 - h);
  }
  return a;
}

// the surface of the glass as a height field. analytic and smooth
// everywhere, so its slope never jumps. the distance field is fine for
// the silhouette, but its gradient flips along the medial axis of any
// straight edge, and that seam prints straight through the body
float domeH(vec2 p, vec2 c, float r) {
  vec2 hs = vec2(r * uShapeW * (1.0 + uDeform.x),
                 r * uShapeH * (1.0 + uDeform.y)) * uScale;
  vec2 u = (p - c) / hs;
  float rr = pow(pow(abs(u.x), 4.0) + pow(abs(u.y), 4.0), 0.25);
  // 1 - r^n. flat through the middle, steepest right at the rim, and
  // that slope stays finite. a hemisphere would run to infinity there
  // and tear; a cosine would flatten out and give no splay at all
  float t = min(rr, 1.0);
  return 1.0 - pow(t, uSplay);
}

// spectrum by wavelength. k = 0 red, k = 1 violet
vec3 spectral(float k) {
  vec3 red    = vec3(1.00, 0.22, 0.20);
  vec3 orange = vec3(1.00, 0.58, 0.18);
  vec3 gold   = vec3(1.00, 0.88, 0.42);
  vec3 green  = vec3(0.50, 0.96, 0.62);
  vec3 cyan   = vec3(0.32, 0.82, 1.00);
  vec3 blue   = vec3(0.36, 0.46, 1.00);
  vec3 a  = mix(red, orange, smoothstep(0.00, 0.22, k));
  vec3 b  = mix(a,   gold,   smoothstep(0.22, 0.42, k));
  vec3 cq = mix(b,   green,  smoothstep(0.42, 0.60, k));
  vec3 dq = mix(cq,  cyan,   smoothstep(0.60, 0.80, k));
  return   mix(dq,   blue,   smoothstep(0.80, 1.00, k));
}

// the rim aurora. colour flows around the outline for real: a cyclic
// hue wheel travels one way and two comets with soft tails orbit at
// their own speeds, one against the stream. the bright moments are
// where they meet; between them the rim is allowed to be dark. one
// cold family only, teal into blue into violet, no rainbow
vec3 aurHue(float x) {
  float k = 0.5 + 0.5 * sin(x * 6.28318);
  vec3 teal   = vec3(0.25, 0.92, 1.00);
  vec3 blue   = vec3(0.30, 0.45, 1.00);
  vec3 violet = vec3(0.62, 0.40, 1.00);
  return mix(mix(teal, blue, min(k * 2.0, 1.0)),
             violet, max(k * 2.0 - 1.0, 0.0));
}
// no parade of rigid shapes on a rail. three waves travel the outline
// at phrased, incommensurate speeds; their interference makes the
// pools. because the waves slide against each other, a pool morphs as
// it moves: it is born, stretches, merges, tears. nothing keeps its
// shape, which is exactly what mechanical motion cannot do
vec4 glowField(float ang, float t) {
  float ts = t * uAuroraSpeed;
  float w1 = sin(ang * 2.0 - ts * 0.53 - 0.8 * sin(ts * 0.19));
  float w2 = sin(ang * 3.0 + ts * 0.31 + 1.2 * sin(ts * 0.23 + 2.0));
  float w3 = sin(ang * 1.0 - ts * 0.20 + 4.0);
  float f = w1 * 0.55 + w2 * 0.35 + w3 * 0.45;
  float amp = pow(clamp(f * 0.55 + 0.5, 0.0, 1.0), 3.0) * 1.6 + 0.10;

  // a breath of irregular flicker on top, three percent, never repeating
  amp *= 0.97 + 0.03 * sin(t * 6.1) * sin(t * 4.3 + 1.0);

  // the hue rides the wheel but the field warps it, so colour and light
  // belong to each other instead of passing each other by
  vec3 hue = aurHue(ang / 6.28318 - ts * 0.045 + 0.10 * w2);
  hue = mix(hue, vec3(1.0), min(amp * amp * 0.10, 0.30));
  return vec4(hue, amp);
}

// how deep the light spills into the body, morphing on its own clock:
// sometimes it hugs the rim, sometimes it reaches in
float reachMod(float ang, float t) {
  float ts = t * uAuroraSpeed;
  return 0.65 + 0.45 * sin(ang * 2.0 + ts * 0.26 + 2.6)
              * sin(ang * 1.0 - ts * 0.17);
}

void main() {
  float aspect = uRes.x / uRes.y;
  vec2 q = vec2(vUv.x * aspect, vUv.y);
  vec2 c = vec2(uLens.x * aspect, uLens.y);

  // first-order distance: field over gradient magnitude. keeps the rim,
  // shadow and bands equally thick all the way around
  float e = 0.0015;
  float F = scene(q, c, uR);
  vec2 g = vec2(
    scene(q + vec2(e, 0.0), c, uR) - scene(q - vec2(e, 0.0), c, uR),
    scene(q + vec2(0.0, e), c, uR) - scene(q - vec2(0.0, e), c, uR)
  ) / (2.0 * e);
  float gm = max(length(g), 1e-3);
  float d = F / gm;
  vec3 col = texture2D(uTex, vec2(vUv.x + uPan.x, 1.0 - vUv.y + uPan.y)).rgb;

  if (d < 0.0) {
    // ---- the lens ----
    // one idea: push the background outward, nothing at the centre,
    // hardest at the rim, plus the magnification a thick body gives.
    // all of it in body space, so it stays smooth everywhere. distance
    // field gradients and height normals both tear on straight edges
    vec2 hs = vec2(uR * uShapeW * (1.0 + uDeform.x),
                   uR * uShapeH * (1.0 + uDeform.y)) * uScale;
    vec2 u = (q - c) / hs;
    float rRaw = pow(pow(abs(u.x), 6.0) + pow(abs(u.y), 6.0), 1.0 / 6.0);
    float r = min(rRaw, 1.0);
    vec2 dir = length(u) > 1e-5 ? normalize(u) : vec2(0.0);

    // inside a droplet, that droplet is the lens. a soft handover in
    // each neck, so the refraction never jumps. the hover level rides
    // along: every body glows only for itself
    vec2 ce = c;
    float hovG = uHover;
    float bodyPh = 0.0;      // every body shimmers on its own phase
    float dropW = 0.0;       // 0 button, 1 inside a circle
    for (int i = 0; i < 3; i++) {
      if (uDropRs[i] < 1e-4) continue;
      vec2 dc = vec2(uDrops[i].x * aspect, uDrops[i].y);
      float rD = length(q - dc) / uDropRs[i];
      // two separate handovers. the refraction keeps the soft, clamped
      // blend that the approved glass look is built on. the light gets
      // the strict one: a pixel on a circle belongs to the circle, so
      // the button's hover cannot lend every ring half its glow
      float wD = smoothstep(0.12, -0.12, rD - r);
      float wG = smoothstep(0.12, -0.12, rD - rRaw);
      if (wD > 0.001 || wG > 0.001) {
        vec2 dirD = length(q - dc) > 1e-5 ? normalize(q - dc) : vec2(0.0);
        r = mix(r, min(rD, 1.0), wD);
        dir = normalize(mix(dir, dirD, wD));
        hs = mix(hs, vec2(uDropRs[i]), wD);
        ce = mix(c, dc, wD);
        hovG = mix(hovG, uDropHov[i], wG);
        bodyPh = mix(bodyPh, (float(i) + 1.0) * 2.13, wG);
        dropW = mix(dropW, 1.0, wG);
      }
    }

    float push = pow(r, uSplay) * uRefraction * 0.42;
    float mag  = (1.0 - r * r) * uDepth * 0.30;

    vec2 base = vUv - (q - ce) / vec2(aspect, 1.0) * mag;
    vec2 off  = dir * push * hs / vec2(aspect, 1.0);


    // spectral spread: sample across a run of wavelengths and weight each
    // by its colour. three channels at three offsets gives hard red and
    // blue edges; a weighted fan gives the soft glow real glass has.
    // note the minus: pushing the sample inward bulges the image outward
    vec3 acc3 = vec3(0.0);
    vec3 wsum = vec3(0.0);
    for (int i = 0; i < 9; i++) {
      float k = float(i) / 8.0;
      float sc = 1.0 + uDispersion * 9.0 * (k - 0.5);
      float a2 = float(i) * 0.698;
      vec2 j = vec2(cos(a2), sin(a2)) * uFrost * 0.05 * (0.3 + 0.7 * k);
      vec2 uvS = base - off * sc + j;
      vec3 samp = texture2D(uTex, vec2(uvS.x + uPan.x, 1.0 - uvS.y + uPan.y)).rgb;
      vec3 w = spectral(k) + 0.35;
      acc3 += samp * w;
      wsum += w;
    }
    col = acc3 / max(wsum, vec3(0.001));

    float depth = clamp(1.0 - r, 0.0, 1.0);
    float bend = r * r;

    // slight glass tint toward the rim
    col *= mix(1.0, 0.9, bend);

    // the body is smoked at the top and clears toward the bottom.
    float hh = uR * uShapeH * (1.0 + uDeform.y) * uScale;
    float up = (q.y - c.y) / hh;                 // -1 bottom, +1 top
    // wide and eased twice. a narrow ramp reads as an overlay, a long
    // one reads as tinted material. never fully black, the body keeps depth
    float smoke = smoothstep(-0.95 + uSmokePos, 1.0 + uSmokePos, up);
    smoke = smoke * smoke * (3.0 - 2.0 * smoke);
    smoke = smoke * smoke * (3.0 - 2.0 * smoke);
    col = mix(col, col * 0.10, smoke * uSmoke);

    // the glow clings to the inside of the outline and is gone before
    // the middle. angle and radius in the frame of the body this pixel
    // belongs to, gated by that body's own hover
    // on the small circles the pools are angularly compressed and the
    // reach damped, so their rings stay as filigree as the button's
    // stretched edges instead of turning into fat arcs
    // the circles run the field at double angular frequency, but only
    // integer multiples keep it periodic around the outline. and the two
    // frequencies are blended as results, never as angles: a blended
    // angle scale is aperiodic and tears at the atan seam, which is
    // exactly the quarter-disc artefact
    vec2 uL = (q - ce) / hs;
    float ga = atan(uL.y, uL.x);
    vec4 gfB = glowField(ga, uTime);
    vec4 gfD = glowField(ga * 2.0 + bodyPh, uTime);
    vec4 gf = mix(gfB, gfD, dropW);
    float rm = mix(reachMod(ga, uTime), reachMod(ga * 2.0 + bodyPh, uTime), dropW);
    float reach = uAuroraRay * (0.55 + 0.45 * gf.a) * rm * mix(1.0, 0.58, dropW);
    float glow = pow(smoothstep(1.0 - reach, 1.0, r), 1.6)
               * gf.a * uAurora * hovG;
    col += gf.rgb * glow * 0.62;

    // the only colour in here comes from the dispersion above
    float band = smoothstep(0.14, 0.02, depth) * smoothstep(0.0, 0.02, depth);
    float topness = clamp((q.y - c.y) / uR, -1.0, 1.0);
    col += vec3(1.0) * band * smoothstep(0.45, 1.0, topness) * 0.14;
  }

  // glass casts, but barely: a wide low-density veil below the body and
  // a slightly denser seam at the contact edge. present, never a stain
  float outside = step(0.0, d);
  // a normal drop shadow: small offset down, wide soft blur, very low
  // density. an exponential falloff keeps it from reading as a cloud
  // soft, and sized in body radii so it survives being scaled. a fixed
  // blur in screen space is what made the small version look wrong:
  // the body shrank, the shadow did not
  float dCast = scene(q - vec2(0.0, -0.30 * uR), c, uR) / gm;
  float soft = 0.62 * uR;
  float veil = exp(-max(dCast, 0.0) / soft) * outside;
  // the light stands above, so nothing is cast upward
  veil *= 1.0 - smoothstep(-0.55 * uR, 0.45 * uR, q.y - c.y);
  col *= 1.0 - veil * uShadow;

  // the rim is not a stroke. it is the lit edge of a body with thickness:
  // a bright band where the surface turns into the light, fading to
  // nothing on the far side, plus a soft inner falloff for the wall
  vec3 L = normalize(vec3(cos(uLightAngle), sin(uLightAngle), 0.42));
  vec3 nrm = normalize(vec3(g / gm, 0.5));
  float facing = clamp(dot(nrm, L), 0.0, 1.0);

  // widths in pixels, not uv. keeps the edge a hairline at any resolution
  float px = 1.0 / uRes.y;
  float band  = smoothstep(px * 2.0, 0.0, abs(d));       // the lit edge
  float wall  = smoothstep(px * 16.0, 0.0, abs(d));      // thickness behind it
  float lit   = pow(facing, 4.0);                        // direct specular

  // light entering the top pools along the lower wall and escapes there.
  // that reflection is brighter than the specular above it
  float down  = clamp(-dot(nrm, L), 0.0, 1.0);
  float tir   = pow(down, 1.6);

  // the rim carries the same light: whichever body owns this stretch
  // of edge lends its frame and its own hover level
  vec2 hsr = vec2(uR * uShapeW * (1.0 + uDeform.x),
                  uR * uShapeH * (1.0 + uDeform.y)) * uScale;
  vec2 ur = (q - c) / hsr;
  float rSel = pow(pow(abs(ur.x), 6.0) + pow(abs(ur.y), 6.0), 1.0 / 6.0);
  float hovR = uHover;
  float selPh = 0.0;
  float selSc = 1.0;
  for (int i = 0; i < 3; i++) {
    if (uDropRs[i] < 1e-4) continue;
    vec2 dc = vec2(uDrops[i].x * aspect, uDrops[i].y);
    float rD = length(q - dc) / uDropRs[i];
    if (rD < rSel) {
      rSel = rD; ur = (q - dc) / uDropRs[i];
      hovR = uDropHov[i]; selPh = (float(i) + 1.0) * 2.13; selSc = 2.0;
    }
  }
  vec4 gfr = glowField(atan(ur.y, ur.x) * selSc + selPh, uTime);
  float aglow = uAurora * hovR * gfr.a;
  vec3 rimCol = mix(vec3(1.0, 0.99, 0.96), gfr.rgb, clamp(aglow * 1.1, 0.0, 1.0));
  col += gfr.rgb * band * aglow * 0.55;
  col += gfr.rgb * wall * aglow * 0.17;
  // light transport: a shining body throws its light onto the others.
  // the stretch of rim facing the source catches exactly the hue the
  // source shows in this direction, and it dies with distance. no body
  // lights itself, that is what the glow above already did
  for (int j = 0; j < 4; j++) {
    vec2 srcP; float srcHov; float srcR; float srcPh;
    if (j == 0) {
      srcP = c; srcHov = uHover; srcR = hsr.y; srcPh = 0.0;
    } else {
      if (uDropRs[j - 1] < 1e-4) continue;
      srcP = vec2(uDrops[j - 1].x * aspect, uDrops[j - 1].y);
      srcHov = uDropHov[j - 1];
      srcR = uDropRs[j - 1];
      srcPh = float(j) * 2.13;
    }
    if (srcHov * uAurora < 0.004) continue;
    if (abs(srcPh - selPh) < 0.01) continue;
    vec2 toSrc = srcP - q;
    float ds = length(toSrc);
    if (ds < 1e-4) continue;
    vec2 Ldir = toSrc / ds;
    float facing2 = clamp(dot(nrm.xy, Ldir), 0.0, 1.0);
    float fall = exp(-max(ds - srcR, 0.0) * 6.0);
    vec4 gs = glowField(atan(-Ldir.y, -Ldir.x) * (j == 0 ? 1.0 : 2.0) + srcPh, uTime);
    vec3 lc = gs.rgb * gs.a * srcHov * uAurora * uBounce * facing2 * fall;
    col += lc * (band * 0.85 + wall * 0.25);
  }

  // caustics: the same light falls past the body and lands on the
  // ground beneath it. the pool carries the hue the source sends
  // downward, spreads on its way, and dies out. hover-gated like
  // everything the aurora does
  for (int j = 0; j < 4; j++) {
    vec2 srcP; float srcHov; float srcR; float srcPh;
    if (j == 0) {
      srcP = c; srcHov = uHover; srcR = hsr.y; srcPh = 0.0;
    } else {
      if (uDropRs[j - 1] < 1e-4) continue;
      srcP = vec2(uDrops[j - 1].x * aspect, uDrops[j - 1].y);
      srcHov = uDropHov[j - 1];
      srcR = uDropRs[j - 1];
      srcPh = float(j) * 2.13;
    }
    if (srcHov * uAurora * uPool < 0.004) continue;
    vec2 toP = q - srcP;
    float travel = -toP.y - srcR * 0.4;
    if (travel < -srcR * 0.9) continue;
    // the pool fades in over most of a radius instead of starting on a
    // hard line. the old outside mask used to hide that edge; through
    // the glass it was suddenly naked
    float rise = smoothstep(-srcR * 0.9, srcR * 0.7, travel);
    float spreadW = (j == 0 ? hsr.x * 0.8 : srcR) * (0.8 + travel * 1.5 / srcR * 0.5);
    float lat = exp(-pow(toP.x / spreadW, 2.0));
    float reach = exp(-pow(travel / (srcR * 1.6), 2.0));
    vec4 gs = glowField(atan(toP.y, toP.x) * (j == 0 ? 1.0 : 2.0) + srcPh, uTime);
    // the glass is transparent: the pool continues behind the body,
    // seen through the material and dimmed by it, instead of being cut
    // off at the silhouette
    float through = outside + (1.0 - outside) * 0.45;
    col += gs.rgb * gs.a * lat * reach * rise * through * uAurora * srcHov * uPool * 0.55;
  }

  // the light does not stop at the wall: where a pool stands, a soft
  // bloom breathes past the rim into the dark. one bloom per body,
  // summed, because light superposes. running it off the union field
  // instead prints the field's medial-axis creases as hard seams the
  // moment the level goes up
  for (int j = 0; j < 4; j++) {
    vec2 srcP; float srcHov; float srcR; float srcPh; float dB;
    if (j == 0) {
      srcP = c; srcHov = uHover; srcR = hsr.y; srcPh = 0.0;
      dB = lensField(q, c, uR) / gm;
    } else {
      if (uDropRs[j - 1] < 1e-4) continue;
      srcP = vec2(uDrops[j - 1].x * aspect, uDrops[j - 1].y);
      srcHov = uDropHov[j - 1];
      srcR = uDropRs[j - 1];
      srcPh = float(j) * 2.13;
      dB = length(q - srcP) - srcR;
    }
    if (srcHov * uAurora < 0.004) continue;
    vec2 urB = (q - srcP) / srcR;

function drawPlate() {
  const w = tex2d.width, h = tex2d.height;
  const T = ANTE_THEMES[anteTheme];
  ctx.fillStyle = T.bg;
  ctx.fillRect(0, 0, w, h);

  // the wordmark lies on the plate at full width, barely there, and
  // sinks into the ground: full at the cap line, gone by the baseline
  {
    // the photograph is the plate, cover-fitted, at full strength
    if (plateImg.complete && plateImg.naturalWidth) {
      // fitted by width, never by height. cover on a square card zooms a
    // 16:9 plate by 1.78 and the letters become furniture. the plate is
    // black at the top and the bottom anyway, so what is missing on a
    // tall frame is black, which is what was there before
    const k = w / plateImg.naturalWidth;
      const iw = plateImg.naturalWidth * k, ih = plateImg.naturalHeight * k;
      ctx.save();
      if (anteTheme === 'light') ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(plateImg, (w - iw) / 2, (h - ih) / 2, iw, ih);
      ctx.restore();
    } else {
    const logoW = w;
    const sc = logoW / 545;
    const logoH = 143 * sc;
    const top = (h - logoH) / 2;
    const rgb = anteTheme === 'light' ? '255,255,0' : '255,255,255';
    ctx.save();
    ctx.globalAlpha = anteTheme === 'light' ? 0.32 : 0.08;
    ctx.translate(0, top);
    ctx.scale(sc, sc);
    // the gradient has to be built after the transform. canvas maps it
    // through the current matrix at fill time, so one built in page
    // pixels lands far below the glyphs once they are scaled up
    const g = ctx.createLinearGradient(0, 0, 0, 143);
    g.addColorStop(0.00, 'rgba(' + rgb + ',1)');
    g.addColorStop(0.45, 'rgba(' + rgb + ',0.77)');
    g.addColorStop(0.72, 'rgba(' + rgb + ',0.29)');
    g.addColorStop(0.93, 'rgba(' + rgb + ',0)');

    for (const d of JELLY) ctx.fill(new Path2D(d));

  }

  ctx.fillStyle = T.fg;

  ctx.textBaseline = 'middle';

  // it runs past the body and the body only ever shows the slice it
  // happens to sit on, the way a mechanical counter does
  const cx = lx * w, cy = (1 - ly) * h;
  const { hw, hh } = lensHalf();
  const step = hh * h * 1.55;             // distance between two values
  const fs = Math.round(hh * h * 1.05);
  ctx.font = '600 ' + fs + 'px ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif';

  // to see, so the number is never on the wall, only ever in the glass

  ctx.roundRect(cx - cw / 2, cy - ch / 2, cw, ch, ch / 2);

    const y = cy + (wheel - v) * step;
    if (y < cy - ch || y > cy + ch) continue;
    ctx.fillText(String(v), cx, y);
  }
  ctx.restore();

  // the signs. each one lives on the plate only while its droplet is
  // out, and grows with it, so it is born and swallowed together with
  // the body that carries it
  for (let i = 0; i < ND; i++) {
    const D = drops[i];
    const sc = Math.max(0, D.isc);
    if (D.rad < 0.004 || sc <= 0.01) continue;
    const r = D.rad * h;
    const bar = r * 0.52 * sc * (1 + D.g * 1.1);

    if (i === 1) ctx.fillRect(-th / 2, -bar / 2, th, bar);
    ctx.restore();
  }
}

function uploadPlate() {

// ============================================================
// physics. one body in the middle, two droplets beside it. the body
// never leaves its home, so the whole system is about birth, swallow
// and the wobble each of those costs
// ============================================================
let lx = 0.5, ly = 0.5, vx = 0, vy = 0;
let tx = 0.5, ty = 0.5;                   // where the hand wants it
let dragging = false, grabX = 0, grabY = 0, downMx = 0, downMy = 0;
let dX = 0, dXv = 0, dY = 0, dYv = 0;     // the body's jelly
let lurch = 0, lurchV = 0;                // the sideways blob on a press

const ND = 2;                             // 0 = minus, 1 = plus
const drops = [0, 1].map(() => ({
  bx: 0.5, by: 0.5, bvx: 0, bvy: 0, rad: 0, radV: 0, live: false,
  g: 0, gV: 0, hovT: 0, hv: 0, born: 0,
  // the sign has its own springs: it is pushed through the body on the

  const ar = canvas.width / canvas.height;

  const ar = canvas.width / canvas.height;
  for (let i = 0; i < ND; i++) {
    const D = drops[i];
    if (!D.live || D.rad < 0.02) continue;
    if (Math.hypot((mx - D.bx) * ar, my - D.by) < dropEffR(D) + 0.02) return i;

}

  return Math.abs(mx - lx) < hw + 0.02 / ar && Math.abs(my - ly) < hh + 0.02;

function step(dir) {
  const nv = Math.max(0, Math.min(MAXV, value + dir));
  if (nv === value) return;
  value = nv;

  wheelV += -dir * 5.2;

  // squashes, and rings back out of the same springs
  lurchV += dir * 0.9;

addEventListener('pointermove', e => {

  if (inside && !hovT) { dYv += 1.4; dXv += 1.1; }
  if (!inside && hovT) { dYv -= 0.9; dXv -= 0.7; }

  for (let i = 0; i < ND; i++) {
    const D = drops[i];
    if (i === di && !D.hovT) D.gV += 1.9;
    if (i !== di && D.hovT) D.gV -= 1.2;
    D.hovT = i === di ? 1 : 0;

canvas.addEventListener('pointerdown', e => {
  const mx = e.clientX / innerWidth, my = 1 - e.clientY / innerHeight;
  const di = overDrop(mx, my);

    drops[di].gV -= 1.6;

  // stepper travels with it

    const st = D.live ? 1 : 0;
    const sk = 150, sd = 2 * Math.sqrt(sk) * 0.58;
    D.iscV += (sk * (st - D.isc) - sd * D.iscV) * dt;

function physics(dt) {

  // frame or two. nothing here survives a zero-area canvas, so wait

  // with a spring that stiffens the further you get, and it never
  // fully agrees. released, it flies home and overshoots
  {
    const hx = lx - 0.5, hy = ly - 0.5;
    const pull = Math.hypot(hx, hy);

      vy += (k * (ty - ly) - d * vy) * dt;

      vy += -ka * hy * dt;

      vx += (-ka * hx - dmp * vx) * dt;
      vy += (-ka * hy - dmp * vy) * dt;

    // into the body as squash

    if (ly < hh)      { ly = hh;      if (vy < 0) { dYv -= Math.min(-vy * kick, 3); dXv += Math.min(-vy * kick * 0.7, 2); vy = -vy * rest; } }

  // and comes back, like a picker that has been flicked

      D.live = true;

      D.by = ly;
      D.bvx = sgn * 1.15;
      D.bvy = 0;
      dXv -= 0.4;

    const ty2 = out ? slot.y : inY;

      const bk = dragging || Math.hypot(vx, vy) > 0.05 ? 130 : 200;

      // stretches long instead of snapping

      D.by += D.bvy * dt;

    // happens inside the body where nobody sees it. a body with no
    // width would divide by zero here, and one NaN never washes out
    const along = hw > 1e-5 ? Math.abs((D.bx - lx) * aspect) / (hw * aspect) : 0;
    const swell = Math.min(Math.max((along - 0.35) / 0.80, 0), 1);
    const radT = !D.live ? 0 : out ? RAD : RAD * (0.32 + 0.68 * swell);
    D.radV += (180 * (radT - D.rad) - 2 * Math.sqrt(180) * 0.6 * D.radV) * dt;
    D.rad += D.radV * dt;
    if (!isFinite(D.rad) || !isFinite(D.radV)) { D.rad = radT; D.radV = 0; }
    D.rad = Math.max(D.rad, 0);

    const gT = pressIdx === i ? -0.12 : D.hovT * 0.11;
    D.gV += (-90 * (D.g - gT) - 2 * Math.sqrt(90) * 0.5 * D.gV) * dt;
    D.g += D.gV * dt;
    D.hv += (D.hovT - D.hv) * Math.min(dt * 6, 1);
  }

  const neckT = 0.05 + 0.085 * maxZone;
  neck += (neckT - neck) * Math.min(dt * 10, 1);

  // the body's jelly, underdamped so it rings a few times
  const jk = 90, jd = 2 * Math.sqrt(90) * 0.5;

function deformNow() {

           + Math.min(Math.abs(vy) * 0.22, 0.20) + Math.min(Math.abs(ly - 0.5) * 0.9, 0.22);
  const ux = Math.max(-0.30, Math.min(0.35, dX + sx - sy * 0.6));
  const uy = Math.max(-0.30, Math.min(0.35, dY + sy - sx * 0.6));

  dpr = Math.min(devicePixelRatio, 2);
  const w = Math.max(1, Math.round(innerWidth * dpr));
  const h = Math.max(1, Math.round(innerHeight * dpr));
  if (canvas.width === w && canvas.height === h) return;
  canvas.width = w; canvas.height = h;
  gl.viewport(0, 0, w, h);
  plateStale = true;
  sizeAt = performance.now();
}
function resize() {
  sizeCanvas();
  rebuildPlate();
}
function rebuildPlate() {
  plateStale = false;
  // the plate runs at full device resolution. it used to be capped at
  // 1600 to keep the upload cheap, but the led raster is a one pixel
  // grid: the moment the shader has to scale the texture, the grid is
  // no longer on the device pixels and the whole point is gone
  // the plate is capped: an uncapped one costs 14 MB of texture per
  // context, and a phone holds eight of these contexts at once
  const capW = Math.min(canvas.width, 1600);
  tex2d.width = capW;
  tex2d.height = Math.max(1, Math.round(capW * canvas.height / canvas.width));
  plateDirty = true;
}
// a phone holds one of these contexts per card plus one for the
// fullscreen view. when the browser runs short it takes a context away
// and the canvas stays black for good. catching the loss lets it come
// back instead
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); }, false);
canvas.addEventListener('webglcontextrestored', () => { location.reload(); }, false);
addEventListener('resize', resize);
resize();
// belt and braces. the drop is created inside a parked iframe and then
// grown, and the order in which the size, the image and the first frame
// arrive is not something it can rely on. two forced rebuilds and one
// on becoming visible cost nothing and close every gap
setTimeout(resize, 300);
setTimeout(resize, 1200);
document.addEventListener('visibilitychange', () => { if (!document.hidden) resize(); });

// the host asks for the drop to come home before it shrinks the
// window. the stepper winds back to zero, lets go of the hand and the
// hover, and reports busy until everything has stopped moving
window.__recall = () => {
  hovT = 0;
  drops.forEach(D => { D.hovT = 0; });
  dragging = false;
  pressIdx = -1;
  const had = value !== 0 || Math.abs(lx - 0.5) > 0.004 || Math.abs(ly - 0.5) > 0.004;
  value = 0;
  return had;
};
window.__busy = () =>
  Math.abs(wheel) > 0.02 || Math.abs(wheelV) > 0.15 ||
  drops[0].live ||
  Math.abs(lx - 0.5) > 0.004 || Math.abs(ly - 0.5) > 0.004 ||
  Math.abs(vx) > 0.02 || Math.abs(vy) > 0.02 ||
  Math.abs(dX) > 0.03 || Math.abs(dY) > 0.03 ||
  Math.abs(lurch) > 0.02;

// the host closes the window on a tap unless the drop claims the spot
window.__solid = (mx, my) => {
  if (overLens(mx, my)) return true;
  return overDrop(mx, my) >= 0;
};

let last = performance.now();
// the loop can be stopped. the host stops the cards that are out of
// view, the browser stops the whole tab when it is hidden. either way
// nothing renders that nobody sees, and a page open in three tabs no
// longer runs twenty four shader loops at once
let paused = false, hostPaused = false, rafPending = false;
function refreshPause() {
  const p = hostPaused || document.hidden;
  if (p === paused) return;
  paused = p;
  if (!paused && !rafPending) {
    last = performance.now();          // no giant dt after the sleep
    rafPending = true;
    requestAnimationFrame(frame);
  }
}
addEventListener('message', e => {
  if (e.data && typeof e.data.antePause === 'boolean') { hostPaused = e.data.antePause; refreshPause(); }
});
document.addEventListener('visibilitychange', refreshPause);

function frame(t) {
  rafPending = false;
  if (paused) return;
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  // the iframe is grown from card size to full screen and a resize
  // event is not guaranteed for that. ask every frame instead
  sizeCanvas();
  if (plateStale && performance.now() - sizeAt > 120) rebuildPlate();
  // the springs are stepped explicitly, and an explicit step is only
  // honest while it is short: at thirty frames a second the marks'
  // damping term overshoots and flips their speed every frame. that is
  // the shake on a phone. so a slow frame is cut into steps no longer
  // than a 120th of a second
  const n = Math.max(1, Math.ceil(dt * 120));
  const h = dt / n;
  for (let i = 0; i < n; i++) { physics(h); markPhysics(h); }

  // the plate is only redrawn while something on it moves
  if (plateDirty ||
      Math.abs(wheel - lastWheel) > 0.0015 ||
      Math.abs(drops[0].rad - lastRads[0]) > 0.0004 ||
      Math.abs(drops[1].rad - lastRads[1]) > 0.0004 ||
      Math.abs(drops[0].bx - lastPos[0]) > 0.0006 ||
      Math.abs(drops[1].bx - lastPos[1]) > 0.0006 ||
      Math.abs(drops[0].isc - lastSc[0]) > 0.0008 ||
      Math.abs(drops[1].isc - lastSc[1]) > 0.0008 ||
      Math.abs(drops[0].irot - lastRot[0]) > 0.0008 ||
      Math.abs(drops[1].irot - lastRot[1]) > 0.0008 ||
      Math.abs(drops[0].ix - lastMark[0]) > 0.0002 ||
      Math.abs(drops[1].ix - lastMark[1]) > 0.0002 ||
      Math.abs(drops[0].iy - lastMark[2]) > 0.0002 ||
      Math.abs(drops[1].iy - lastMark[3]) > 0.0002 ||
      Math.abs(lx - lastBody[0]) > 0.0004 || Math.abs(ly - lastBody[1]) > 0.0004) {
    drawPlate();
    uploadPlate();
    lastWheel = wheel;
    lastRads = [drops[0].rad, drops[1].rad];
    lastPos = [drops[0].bx, drops[1].bx];
    lastSc = [drops[0].isc, drops[1].isc];
    lastRot = [drops[0].irot, drops[1].irot];
    lastMark = [drops[0].ix, drops[1].ix, drops[0].iy, drops[1].iy];
    lastBody = [lx, ly];
    plateDirty = false;
  }

  scaleV += (scaleT - scale) * 0.045 - scaleV * 0.26;
  scale += scaleV;
  hovV += ((dragging ? 0 : hovT) - hov) * 0.030 - hovV * 0.24;
  hov += hovV;

  gl.uniform1f(uHover, Math.max(0, hov));
  gl.uniform1fv(uDropHov, [Math.max(0, drops[0].hv), Math.max(0, drops[1].hv), 0]);
  gl.uniform1f(uScale, scale);
  for (const k in DEFAULTS) gl.uniform1f(U[k], P[k]);
  gl.uniform1f(uShadowUpLoc, 1.0);
  gl.uniform1f(U.shadow, anteTheme === 'light' ? 0.26 : 0.34);
  // less smoke than the glass drop: three bodies close together read
  // better with a clearer rim
  gl.uniform1f(U.smoke, anteTheme === 'light' ? 0.18 : 0.35);

  gl.uniform2f(uPan, 0.0, 0.0);
  gl.uniform1i(uTex, 0);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, t * 0.001);

  const k = respK();
  const bodyX = lx + lurch * 0.012;
  gl.uniform2f(uLens, bodyX, ly);
  gl.uniform1f(uRU, 0.13 * k);
  gl.uniform2fv(uDeform, deformNow());
  gl.uniform2fv(uDrops, [drops[0].bx, drops[0].by, drops[1].bx, drops[1].by, 0.5, -1]);
  gl.uniform1fv(uDropRs, [dropEffR(drops[0]), dropEffR(drops[1]), 0]);
  gl.uniform1f(uNeckU, neck * respK());

  gl.drawArrays(gl.TRIANGLES, 0, 3);
  rafPending = true;
  requestAnimationFrame(frame);
}
rafPending = true;
requestAnimationFrame(frame);
refreshPause();   // born in a hidden tab, sleep from the first frame

// ---- theme: the host's light/dark reaches into the drop ----
function applyAnteTheme() { plateDirty = true; }
// the plate is a file. until it lands the drop falls back to the
// wordmark at eight percent, which on black reads as nothing at all
function plateArrived() { plateDirty = true; }
if (plateImg.complete && plateImg.naturalWidth) plateArrived();
else plateImg.addEventListener('load', plateArrived, { once: true });
applyAnteTheme();
</script>
</body>
</html>
